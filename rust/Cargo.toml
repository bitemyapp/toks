[package]
name = "toks"
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"
description = "Exact tokenizer algorithms with native SIMD kernels"

[lib]
path = "lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[features]
# Experimental native merge probe; measured but not enabled by default.
avx512 = []
# Instrumented variants are linked only by tools/rust-port/test.py.
test-api = []
test-allocator = []
test-internals = []
test-degenerate = []
